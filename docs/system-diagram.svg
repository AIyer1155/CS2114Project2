<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>

  <!-- title -->
  <text x="450" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Controlled Chaos: system diagram (Group 11)</text>

  <!-- row 1 -->
  <rect x="360" y="40" width="180" height="56" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="450" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">PlaylistApp</text>
  <text x="450" y="82" text-anchor="middle" font-size="11" fill="#444">text menu (run / main)</text>

  <!-- row 2 -->
  <rect x="40" y="150" width="180" height="60" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="130" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">SongLibrary</text>
  <text x="130" y="194" text-anchor="middle" font-size="11" fill="#444">pool of songs</text>

  <rect x="360" y="150" width="180" height="60" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="450" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">PlaylistGenerator</text>
  <text x="450" y="194" text-anchor="middle" font-size="11" fill="#444">Mode 2 (stretch goal)</text>

  <rect x="680" y="150" width="180" height="60" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="770" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Playlist</text>
  <text x="770" y="194" text-anchor="middle" font-size="11" fill="#444">songs, rules, validate()</text>

  <!-- row 3 -->
  <rect x="360" y="270" width="250" height="70" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="485" y="293" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">PlaylistRule (abstract)</text>
  <text x="485" y="311" text-anchor="middle" font-size="11" fill="#444">BpmRange, NoExplicit,</text>
  <text x="485" y="326" text-anchor="middle" font-size="11" fill="#444">MoodConsistency, NoRepeatArtist</text>

  <rect x="680" y="270" width="180" height="70" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="770" y="293" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">ValidationResult</text>
  <text x="770" y="311" text-anchor="middle" font-size="11" fill="#444">holds Violation(song, ruleType)</text>

  <!-- LinkedChain band -->
  <rect x="40" y="400" width="820" height="100" fill="#f2f2f2" stroke="#111" stroke-width="2"/>
  <text x="450" y="422" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">LinkedChain&lt;T&gt; (provided, unmodified): one generic class, three element types</text>

  <rect x="60" y="436" width="240" height="50" fill="#fff" stroke="#111" stroke-width="1.2"/>
  <text x="180" y="456" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">LinkedChain&lt;Song&gt;</text>
  <text x="180" y="474" text-anchor="middle" font-size="11" fill="#444">in SongLibrary and Playlist</text>

  <rect x="330" y="436" width="240" height="50" fill="#fff" stroke="#111" stroke-width="1.2"/>
  <text x="450" y="456" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">LinkedChain&lt;PlaylistRule&gt;</text>
  <text x="450" y="474" text-anchor="middle" font-size="11" fill="#444">in Playlist</text>

  <rect x="600" y="436" width="240" height="50" fill="#fff" stroke="#111" stroke-width="1.2"/>
  <text x="720" y="456" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">LinkedChain&lt;Violation&gt;</text>
  <text x="720" y="474" text-anchor="middle" font-size="11" fill="#444">in ValidationResult</text>

  <!-- arrows -->
  <g stroke="#333" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M410 96 L160 150"/>
    <path d="M450 96 L450 150"/>
    <path d="M490 96 L740 150"/>
    <path d="M360 180 L220 180"/>
    <path d="M540 180 L680 180"/>
    <path d="M770 210 L770 270"/>
    <path d="M700 210 L560 270"/>
    <path d="M485 340 L485 400"/>
    <path d="M770 340 L770 400"/>
  </g>
  <path d="M130 210 L130 400" stroke="#333" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <!-- arrow labels -->
  <g font-size="11" fill="#333">
    <text x="290" y="170" text-anchor="middle">reads</text>
    <text x="610" y="170" text-anchor="middle">builds</text>
    <text x="780" y="246">validate()</text>
    <text x="600" y="236">holds</text>
    <text x="140" y="300">Song</text>
    <text x="495" y="390">holds</text>
    <text x="780" y="390">Violation</text>
  </g>
</svg>
